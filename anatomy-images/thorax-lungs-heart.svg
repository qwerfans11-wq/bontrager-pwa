    <line x1="326" y1="772" x2="512" y2="790" stroke="#14324a" stroke-width="4"/>

    <text x="818" y="930" font-size="28" font-weight="700">Pleural cavity</text>
    <text x="818" y="962" font-size="22">surrounds each lung</text>
    <line x1="794" y1="968" x2="726" y2="916" stroke="#14324a" stroke-width="4"/>

    <text x="160" y="1160" font-size="28" font-weight="700">Diaphragm</text>
    <text x="160" y="1192" font-size="22">right dome higher than left</text>
    <line x1="404" y1="1174" x2="512" y2="1112" stroke="#14324a" stroke-width="4"/>
